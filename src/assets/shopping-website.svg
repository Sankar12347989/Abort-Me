<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Shopping Website</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#b800ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" rx="90" fill="url(#bg)" />
  <rect x="120" y="120" width="560" height="560" rx="60" fill="rgba(255,255,255,0.12)" />

  <!-- Top nav/search -->
  <rect x="170" y="170" width="460" height="72" rx="26" fill="#fff" opacity="0.92" />
  <rect x="206" y="194" width="260" height="24" rx="12" fill="#0b1220" opacity="0.12" />
  <circle cx="600" cy="206" r="20" fill="url(#accent)" opacity="0.95" />
  <path d="M592 206h16" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <path d="M600 198v16" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Product grid -->
  <rect x="170" y="270" width="220" height="230" rx="30" fill="#fff" opacity="0.92" />
  <rect x="410" y="270" width="220" height="230" rx="30" fill="#fff" opacity="0.92" />
  <rect x="170" y="520" width="460" height="160" rx="30" fill="#fff" opacity="0.92" />

  <!-- Card accents -->
  <rect x="200" y="300" width="160" height="110" rx="18" fill="rgba(0,0,0,0.08)" />
  <rect x="440" y="300" width="160" height="110" rx="18" fill="rgba(0,0,0,0.08)" />
  <rect x="200" y="560" width="220" height="20" rx="10" fill="rgba(0,0,0,0.10)" />
  <rect x="200" y="596" width="320" height="20" rx="10" fill="rgba(0,0,0,0.10)" />

  <!-- Price tags -->
  <path d="M230 426h110" stroke="#0b1220" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round" />
  <path d="M470 426h110" stroke="#0b1220" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round" />
  <circle cx="342" cy="426" r="9" fill="#ff0055" opacity="0.9" />
  <circle cx="582" cy="426" r="9" fill="#22c55e" opacity="0.9" />

  <!-- Cart icon -->
  <path d="M260 640h290" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" />
  <path d="M285 640l30-120h245l-22 88" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" />
  <circle cx="340" cy="670" r="18" fill="url(#accent)" />
  <circle cx="520" cy="670" r="18" fill="url(#accent)" />
</svg>

